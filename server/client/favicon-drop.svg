<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- "The drop" (12 Nov 2026): an episode square falling into the one empty place in a row of three. -->
  <style>
    .tile{fill:#1d1d1f}.have{fill:#fafafa}.new{fill:#8b93f8}.gap{fill:none;stroke:#fafafa;stroke-width:1.6;stroke-dasharray:2.4 2;opacity:.6}
    @media (prefers-color-scheme:dark){.tile{fill:#ededf0}.have{fill:#161617}.new{fill:#4f46e5}.gap{stroke:#161617}}
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <rect class="have" x="4.5" y="19" width="6.5" height="6.5" rx="1.6"/>
  <rect class="gap" x="13.3" y="19.6" width="5.4" height="5.4" rx="1.3"/>
  <rect class="have" x="21" y="19" width="6.5" height="6.5" rx="1.6"/>
  <rect class="new" x="12.75" y="6.5" width="6.5" height="6.5" rx="1.6" transform="rotate(-12 16 9.75)"/>
</svg>
