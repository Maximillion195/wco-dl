<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- "The gap" (12 Nov 2026): four episode squares, one of them the dashed "missing" square from the map. -->
  <style>
    .tile{fill:#1d1d1f}.have{fill:#fafafa}.gap{fill:none;stroke:#8b93f8;stroke-width:2;stroke-dasharray:3 2.4;stroke-linecap:round}
    @media (prefers-color-scheme:dark){.tile{fill:#ededf0}.have{fill:#161617}.gap{stroke:#4f46e5}}
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <rect class="have" x="6" y="6" width="8.5" height="8.5" rx="2"/>
  <rect class="have" x="17.5" y="6" width="8.5" height="8.5" rx="2"/>
  <rect class="have" x="6" y="17.5" width="8.5" height="8.5" rx="2"/>
  <rect class="gap" x="18.5" y="18.5" width="6.5" height="6.5" rx="1.6"/>
</svg>
