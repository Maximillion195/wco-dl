<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WCO Anime Downloader</title>
    <link rel="stylesheet" href="normalize.css" />
    <link rel="stylesheet" href="global.css" />
  </head>

  <body>
    <div class="container">
      <header>
        <h1>WCO Downloader</h1>
        <p class="subtitle">
          Download anime, cartoons and movies from
          <a href="https://www.wcostream.tv/" target="_blank" rel="noopener">wcostream.tv</a>
        </p>
        <button
          id="theme-toggle"
          class="theme-toggle"
          type="button"
          aria-label="Toggle dark mode"
        >
          <span class="theme-icon">🌙</span>
        </button>
      </header>

      <nav class="tabs" role="tablist" aria-label="Content type">
        <button class="tab active" type="button" role="tab" data-type="dubbed">Dubbed Anime</button>
        <button class="tab" type="button" role="tab" data-type="subbed">Subbed Anime</button>
        <button class="tab" type="button" role="tab" data-type="cartoon">Cartoons</button>
        <button class="tab" type="button" role="tab" data-type="movie">Movies</button>
        <button class="tab" type="button" role="tab" data-type="ova">OVA</button>
      </nav>

      <div class="search-container">
        <span class="search-icon" aria-hidden="true">🔍</span>
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Search..."
          autocomplete="off"
          aria-label="Search titles"
        />
      </div>

      <div id="status-message" class="status-message hidden" role="status"></div>

      <div id="loading" class="loading hidden">
        <div class="spinner"></div>
        <p>Loading list... the first load can take up to a minute.</p>
      </div>

      <div id="error-state" class="error-state hidden">
        <div class="error-icon" aria-hidden="true">⚠️</div>
        <p id="error-message"></p>
        <button id="retry-button" class="btn btn-secondary" type="button">Retry</button>
      </div>

      <div id="empty-state" class="empty-state hidden">
        <div class="empty-icon" aria-hidden="true">📭</div>
        <p>No titles match your search.</p>
      </div>

      <p id="result-count" class="result-count"></p>
      <div id="results" class="results-grid"></div>

      <section id="downloads" class="downloads hidden" aria-labelledby="downloads-title">
        <h2 id="downloads-title">Downloads</h2>
        <ul id="downloads-list" class="downloads-list"></ul>
      </section>
    </div>

    <div
      id="download-modal"
      class="modal hidden"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
    >
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modal-title"></h2>
          <button class="modal-close" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <p class="modal-link">
            <a id="modal-link" target="_blank" rel="noopener">Open on wcostream.tv</a>
          </p>

          <div class="series-only">
            <div class="form-group">
              <label for="season-input">Season</label>
              <input id="season-input" type="text" inputmode="numeric" placeholder="All seasons" />
            </div>
            <div class="form-group">
              <label for="episode-input">Episode range</label>
              <input id="episode-input" type="text" placeholder="All episodes" />
              <small>A single episode (3) or a range (1-5)</small>
            </div>
          </div>

          <div class="form-actions">
            <button id="download-specific-btn" class="btn btn-primary series-only" type="button">
              Download selection
            </button>
            <button id="download-all-btn" class="btn btn-secondary series-only" type="button">
              Download all seasons
            </button>
            <button id="download-latest-btn" class="btn btn-secondary series-only" type="button">
              Download latest episode
            </button>
            <button id="sonarr-import-btn" class="btn btn-secondary series-only" type="button">
              Sonarr import
            </button>
            <button id="download-single-btn" class="btn btn-primary episode-only" type="button">
              Download
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
